name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "building ${{ github.sha }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: prod   # must match the environment name exactly (case matters)
    steps:
      - run: echo "deploying ${{ github.sha }} to Prod"
